<!doctype html>
<!-- One App Store screenshot: a caption above the app's screen in a device.
     render.sh passes ?device=iphone|ipad&shot=…&title=…&sub=… in the URL:
     iPhone 6.9" at 1320 × 2868, iPad 13" at 2064 × 2752. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --w: 1320px; --h: 2868px;
    --cap-top: 200px; --cap-pad: 110px; --h1: 112px; --sub: 54px;
    --dev-top: 860px; --dev-w: 1060px; --dev-h: 2304px;
    --bezel: 26px; --radius: 170px; --screen-radius: 146px;
  }
  body.ipad {
    --w: 2064px; --h: 2752px;
    --cap-top: 170px; --cap-pad: 220px; --h1: 136px; --sub: 64px;
    --dev-top: 740px; --dev-w: 1640px; --dev-h: 2167px;
    --bezel: 30px; --radius: 96px; --screen-radius: 66px;
  }
  html, body { margin: 0; overflow: hidden; }
  body {
    width: var(--w); height: var(--h);
    font-family: 'Ubuntu', sans-serif;
    color: #eceef2;
    background:
      radial-gradient(1200px 900px at 50% 105%, rgba(76,141,255,.28), transparent 70%),
      linear-gradient(180deg, #23262e 0%, #16181d 55%, #121419 100%);
    display: flex; flex-direction: column; align-items: center;
  }
  .caption { margin-top: var(--cap-top); text-align: center; padding: 0 var(--cap-pad); }
  h1 { font-weight: 700; font-size: var(--h1); line-height: 1.08; margin: 0; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #6aa2ff; }
  p { font-weight: 400; font-size: var(--sub); line-height: 1.3; color: #a9b1c0; margin: 44px 0 0; }
  .device {
    position: absolute; left: 50%; top: var(--dev-top); transform: translateX(-50%);
    width: var(--dev-w); height: var(--dev-h); box-sizing: border-box;
    padding: var(--bezel); border-radius: var(--radius);
    background: linear-gradient(145deg, #4a505c, #2a2e36 40%, #1b1e24);
    box-shadow: 0 60px 140px rgba(0,0,0,.6), inset 0 0 0 4px #5c6473;
  }
  .screen {
    width: 100%; height: 100%; border-radius: var(--screen-radius); overflow: hidden;
    background: #000 center top / cover no-repeat;
  }
</style>
</head>
<body>
  <div class="caption"><h1 id="t"></h1><p id="s"></p></div>
  <div class="device"><div class="screen" id="screen"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('device') || 'iphone';
  document.getElementById('t').innerHTML = q.get('title') || '';
  document.getElementById('s').textContent = q.get('sub') || '';
  document.getElementById('screen').style.backgroundImage = `url("${q.get('shot')}")`;
</script>
</body>
</html>
