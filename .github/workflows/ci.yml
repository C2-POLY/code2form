name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main keeps its own result; only PR runs are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The goldens in tests/oracle compare byte for byte: keep LF endings
      # on Windows rather than letting Git convert them to CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install the Linux libraries egui and the file dialogs need
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # The toolchain the workspace declares (rust-version), so a new
      # stable clippy does not fail the build with lints nobody saw locally.
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The text() tests compare against outlines measured with the
      # Liberation fonts 2.00.1 that the reference implementation (release
      # 2021.01) bundles; the repository keeps that exact version.
      - name: Point the font search at the repository's fonts
        shell: bash
        run: echo "C2F_FONT_PATH=$GITHUB_WORKSPACE/fonts" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast

      # A test deleted with the feature it covers fails nothing: the
      # features the app must keep have their tests named in a list.
      - name: The required tests are still there
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --workspace --quiet -- --list 2>/dev/null | sed -n 's/: test$//p' | LC_ALL=C sort -u > "$RUNNER_TEMP/tests.txt"
          missing=$(grep -v -e '^#' -e '^$' .github/required-tests.txt | LC_ALL=C sort -u | LC_ALL=C comm -23 - "$RUNNER_TEMP/tests.txt")
          if [ -n "$missing" ]; then
            echo "::error::Tests named in .github/required-tests.txt are gone:"
            echo "$missing"
            exit 1
          fi

  # The engine of the iPad app: crates/mobile built for iOS into its
  # XCFramework, then called from Swift on an iPad simulator.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Stable rather than the workspace's 1.85: uniffi-bindgen reads
      # uniffi.toml through cargo metadata, which needs 1.86.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Build the XCFramework and its Swift bindings
        run: scripts/ios-xcframework.sh

      - name: Test the engine from Swift on an iPad simulator
        working-directory: apps/ios/Code2FormCore
        # An iPad of the newest iOS runtime: the package needs iOS 18.
        run: |
          ipad=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)]) as $version
              | select($version[0] >= 18)
              | .value[] | select(.name | startswith("iPad")) | {version: $version, udid}]
            | sort_by(.version) | last | .udid // empty')
          if [ -z "$ipad" ]; then
            echo "::error::No iPad simulator of iOS 18 or later on this runner"
            exit 1
          fi
          xcodebuild test -scheme Code2FormCore -destination "platform=iOS Simulator,id=$ipad"
