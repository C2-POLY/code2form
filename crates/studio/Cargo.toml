[package]
name = "code2form"
description = "Code2Form: desktop editor with a live 3D preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "code2form"
path = "src/main.rs"

[dependencies]
c2f-lang.workspace = true
c2f-eval.workspace = true
c2f-geom.workspace = true
c2f-circuit.workspace = true
# The assembly progress saved next to a circuit.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.32", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
glam = "0.30"
bytemuck = "1"
rfd = "0.15"

[dev-dependencies]
# Writes the icon's pictures for the bundle (examples/app-icon.rs).
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Already used by eframe; needed to open screenshot runs in the background.
winit = "0.30"
# Already used by eframe's dependencies; files opened from the Finder.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSBundle",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
] }
# Already used by eframe; the app icon in the Dock and the Finder.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSWorkspace",
] }
block2 = "0.6"
